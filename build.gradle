plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.10'
    id 'net.minecrell.plugin-yml.paper' version '0.6.0'
}

version = '4.1.4'

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(21))
}

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url 'https://repo.opencollab.dev/maven-releases/'
    }
    maven {
        url 'https://repo.opencollab.dev/maven-snapshots/'
    }
}

dependencies {
    paperweightDevelopmentBundle('io.papermc.paper:dev-bundle:1.21.4-R0.1-SNAPSHOT')

    /* Compile time libs */
    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    /* Compile time plugin dependencies */
    compileOnly 'io.github.miniplaceholders:miniplaceholders-api:2.2.3'
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }

    /* Paper libs */
    paperLibrary 'com.github.marlester-dev:MCBotLib:1.2.0'
    paperLibrary 'com.github.Revxrsal.Lamp:common:3.3.4'
    paperLibrary 'com.github.Revxrsal.Lamp:bukkit:3.3.4'
    paperLibrary 'dev.dejvokep:boosted-yaml:1.3.7'
    paperLibrary 'dev.dejvokep:boosted-yaml-spigot:1.5'
    paperLibrary 'com.google.inject:guice:7.0.0'
    paperLibrary 'com.google.inject.extensions:guice-assistedinject:7.0.0'
    paperLibrary 'org.javassist:javassist:3.30.2-GA'
    paperLibrary 'net.bytebuddy:byte-buddy-agent:1.14.18'
}

paper {
    loader = 'me.marlester.rfp.ReallyFakePlayersLoader'
    generateLibrariesJson = true

    name = project.name
    version = project.version
    main = 'me.marlester.rfp.ReallyFakePlayers'
    apiVersion = '1.21'
    authors = ['Marlester', 'freethemice']
    contributors = ['Alexey']
    description = 'Simulates next-level fake players on a minecraft server.'
    website = 'https://dev.bukkit.org/projects/really-fake-players'
    serverDependencies {
        'MiniPlaceholders' {
            load = 'BEFORE'
        }
        'Vault' {
            load = 'BEFORE'
            required = false
        }
    }
}

tasks {
    jar {
        from 'LICENSE'
    }
    assemble {
        dependsOn(reobfJar)
    }
}
